# Apache2 Virtual Host Configuration
# File: /etc/apache2/sites-available/studentnotes.conf
# Application: Student Notes — PHP + MySQL CRUD App
# Author: Korman Carter
# Port: 8080 (non-standard, as required)

<VirtualHost *:8080>

    ServerName studentnotes.kormancarter.com
    ServerAdmin korman@kormancarter.com

    # Point to the app directory inside the project
    DocumentRoot /var/www/studentnotes/app

    <Directory /var/www/studentnotes/app>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/studentnotes-error.log
    CustomLog ${APACHE_LOG_DIR}/studentnotes-access.log combined

</VirtualHost>
